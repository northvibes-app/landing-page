server {
    listen 80;
    listen [::]:80;
    server_name northvibes.app www.northvibes.app;

    root /var/www/northvibes;
    index index.html;
    autoindex off;

    location /.well-known/acme-challenge/ { root /var/www/northvibes; }
    location / { return 301 https://northvibes.app$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.northvibes.app;

    ssl_certificate /etc/letsencrypt/live/northvibes.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/northvibes.app/privkey.pem;
    return 301 https://northvibes.app$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name northvibes.app;

    root /var/www/northvibes;
    index index.html;
    autoindex off;

    ssl_certificate /etc/letsencrypt/live/northvibes.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/northvibes.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'none'; font-src 'none'; form-action 'none'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'none'; style-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/css image/svg+xml image/x-icon;

    location = /index.html { expires -1; try_files $uri =404; }
    location /assets/ { expires 1y; try_files $uri =404; }
    location = /styles.css { expires 1y; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
