server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/northvibes.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/northvibes.app/privkey.pem;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name northvibes.app www.northvibes.app;

    root /var/www/northvibes;
    index index.html;
    autoindex off;

    location /.well-known/acme-challenge/ { root /var/www/northvibes; }
    location / { return 301 https://northvibes.app$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.northvibes.app;

    ssl_certificate /etc/letsencrypt/live/northvibes.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/northvibes.app/privkey.pem;
    return 301 https://northvibes.app$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name northvibes.app;

    root /var/www/northvibes;
    index index.html;
    autoindex off;
    server_tokens off;
    client_max_body_size 1m;

    ssl_certificate /etc/letsencrypt/live/northvibes.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/northvibes.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'none'; font-src 'none'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'none'; style-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/css image/svg+xml image/x-icon;

    location ^~ /auth/ {
        access_log off;
        limit_req zone=northvibes_api_per_ip burst=10 nodelay;
        client_max_body_size 16k;
        proxy_pass https://10.26.20.4:443;
        proxy_ssl_server_name on;
        proxy_ssl_name 10.26.20.4;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/northvibes-api-internal-ca.crt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 15s;
    }
    location = /dashboard {
        access_log off;
        proxy_pass https://10.26.20.4:443;
        proxy_ssl_server_name on;
        proxy_ssl_name 10.26.20.4;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/northvibes-api-internal-ca.crt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 15s;
    }

    location = /index.html { expires -1; try_files $uri =404; }
    location /assets/ { expires 1y; try_files $uri =404; }
    location = /styles.css { expires 1y; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
}
